<script>
// ... [ВНУТРИ КЛАССА VoxelGame] ...

  _init() {
    // ... существующий код ...
    
    // ДОБАВЛЕНО: Рука персонажа
    this.hand = new THREE.Mesh(
        new THREE.BoxGeometry(0.2, 0.2, 0.6),
        new THREE.MeshLambertMaterial({ color: 0xFFA07A }) 
    );
    this.hand.position.set(0.3, -0.2, -0.4);
    this.camera.add(this.hand); // Привязываем к камере
  }

  // ДОБАВЛЕНО: Исправленная логика установки блоков (Anti-Stuck)
  _updateBlockInteraction() {
    const pp = this.physics.position;
    const placeX = Math.floor(this.raycast.x);
    const placeY = Math.floor(this.raycast.y);
    const placeZ = Math.floor(this.raycast.z);

    // Проверка, не стоит ли игрок в этом блоке (ноги + голова)
    const isInside = (Math.floor(pp.x) === placeX && Math.floor(pp.y) === placeY && Math.floor(pp.z) === placeZ) ||
                     (Math.floor(pp.x) === placeX && Math.floor(pp.y + 1) === placeY && Math.floor(pp.z) === placeZ);

    if (isInside) {
        console.log("Cannot place block here: player blocking");
        return; 
    }

    // Если всё ок — ставим
    if (this.world.setBlock(placeX, placeY, placeZ, this.activeBlockId)) {
        this.network.sendBlockChange(placeX, placeY, placeZ, this.activeBlockId);
    }
  }

// ... [ОСТАЛЬНОЙ КОД КЛИЕНТА] ...
</script>
